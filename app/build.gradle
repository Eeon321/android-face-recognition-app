plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

/*
 * Release signing.
 *
 * Nothing secret is stored in this repository. keystore.properties (git-ignored)
 * holds only non-secret, machine-specific settings - storeFile, keyAlias and the
 * path to a DPAPI-protected password blob - and the password itself is resolved at
 * configuration time by resolveReleasePassword below. See RELEASE_SIGNING.md for
 * the setup steps and for why a release build produced on a machine without the key
 * is silently signed with the debug certificate.
 */
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

/*
 * Resolves the release signing password without ever reading it from a plaintext
 * file. Two sources, in order:
 *
 *   1. FACE_RELEASE_KEYSTORE_PASSWORD environment variable - for CI, where nothing
 *      is written to disk at all.
 *   2. A DPAPI blob protected with DataProtectionScope.CurrentUser. Only the Windows
 *      account that created it can decrypt it, so the password is not stored in a
 *      form that other local accounts, file backups or a casual directory listing
 *      can read.
 *
 * The blob's location is read from the git-ignored keystore.properties instead of
 * being hardcoded here, so no signing-material location ends up in tracked files.
 *
 * Honest limits: DPAPI is bound to this user and this machine. It does NOT protect
 * against a process already running as you, nor against an administrator. It is a
 * meaningful step up from plaintext (other local users, backups, shoulder-surfing,
 * and accidental commits are all closed off), not a hardware-backed keystore.
 */
def resolveReleasePassword = { Properties props ->
    def fromEnv = System.getenv("FACE_RELEASE_KEYSTORE_PASSWORD")
    if (fromEnv != null && !fromEnv.trim().isEmpty()) {
        return fromEnv.trim()
    }

    def blobPath = props["passwordFile"]
    if (!blobPath) {
        return null
    }
    // The path is interpolated into a PowerShell string literal, so refuse anything
    // that could escape it. Legitimate Windows paths need neither of these.
    // (Single-quoted Groovy strings: a double-quoted "$" is a GString error.)
    if (blobPath.contains("'") || blobPath.contains('$') || blobPath.contains('`')) {
        logger.warn("keystore.properties passwordFile contains unsupported characters; ignoring")
        return null
    }

    try {
        def script = "Add-Type -AssemblyName System.Security; " +
            "\$b=[Convert]::FromBase64String((Get-Content -Raw -Path '$blobPath')); " +
            "[Text.Encoding]::UTF8.GetString([Security.Cryptography.ProtectedData]::Unprotect(\$b,\$null,'CurrentUser')).Trim()"
        def exec = providers.exec {
            commandLine "powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-Command", script
        }
        def value = exec.standardOutput.asText.get().trim()
        return value.isEmpty() ? null : value
    } catch (Exception e) {
        logger.warn("Could not decrypt the release signing password (${e.class.simpleName}). " +
            "Release artefacts will be signed with the debug key instead.")
        return null
    }
}

def releasePassword = hasReleaseKeystore ? resolveReleasePassword(keystoreProperties) : null
def releaseStoreFile = hasReleaseKeystore ? keystoreProperties["storeFile"] : null
def canSignRelease = hasReleaseKeystore && releasePassword != null &&
        releaseStoreFile != null && file(releaseStoreFile).exists()
if (!canSignRelease) {
    logger.lifecycle("No release signing key resolved: producing a debug-signed release build.")
}

android {
    namespace "com.example.facerecognition"
    compileSdkVersion 34

    defaultConfig{
        applicationId "com.example.facerecognition"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }


    signingConfigs {
        release {
            if (canSignRelease) {
                storeFile file(releaseStoreFile)
                storePassword releasePassword
                keyAlias keystoreProperties["keyAlias"]
                keyPassword releasePassword
            }
        }
    }

    buildTypes{
        release {
            // D-17: previously minifyEnabled false, which shipped unshrunk libraries in
            // every ABI. R8 + resource shrinking are on; see app/proguard-rules.pro for
            // the ML Kit / CameraX keep rules this depends on.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Falls back to debug signing when the release key cannot be resolved, so
            // CI and other machines keep producing a buildable artifact. That fallback
            // is why a release APK from a fresh clone is NOT signed with your upload
            // key - always check the certificate before distributing.
            signingConfig canSignRelease ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions{
        jvmTarget = '1.8'
    }

    buildFeatures{
        viewBinding true
    }
}


dependencies{
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    //CameraX
    def camerax_version = "1.3.0"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"


    //ML kit for face detection
    implementation 'com.google.mlkit:face-detection:16.1.5'

    //lifestyle components
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'

    //Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    //Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}